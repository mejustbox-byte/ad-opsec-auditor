name: Публикация существующего предварительного выпуска AD
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Неизменный тег AD
        type: choice
        options: [v0.1.0a1, v0.1.0a2]
        default: v0.1.0a1
        required: true
      expected_commit:
        description: Полный SHA проверенного исходного commit
        default: '63579e76a7766c06dfc4626da683ad2db782d607'
        required: true
        type: string
      release_id:
        description: ID существующего draft этого выпуска
        default: '407852541'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-ad-prerelease
  cancel-in-progress: false
jobs:
  build:
    name: Проверка неизменного тега и сборка
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Проверить commit и версию выбранного тега
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os, re, subprocess
          from ad_opsec_auditor import __version__
          versions = {'v0.1.0a1': '0.1.0a1', 'v0.1.0a2': '0.1.0a2'}
          tag, expected = os.environ['SOURCE_TAG'], os.environ['SOURCE_COMMIT']
          assert tag in versions and re.fullmatch(r'[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          assert subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip() == expected
          assert __version__ == versions[tag]
          PYTHON
      - name: Установка инструментов с проверкой хешей
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Проверка кода тега и синтетических примеров
        run: |
          python -m unittest discover -s tests -v
          python tools/check_schema.py
          python tools/scan_public.py
      - name: Сборка, проверка установки, повторяемости и контрольных сумм
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py
          python tools/smoke_artifacts.py
          python tools/check_reproducible.py
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-ad-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Загрузка проверенных файлов и публикация существующего draft
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-ad-release
          path: release-dist
      - name: Проверка существующего выпуска, загрузка, публикация и повторная сверка
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python tools/publish_release.py --dist release-dist --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
