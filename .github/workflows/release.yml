name: Publish existing AD prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-ad-v0.1.0a1
  cancel-in-progress: false
jobs:
  build:
    name: Verify immutable tag and build artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.1.0a1
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source commit without modifying tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '63579e76a7766c06dfc4626da683ad2db782d607'
          test "$(git rev-parse 'v0.1.0a1^{commit}')" = '63579e76a7766c06dfc4626da683ad2db782d607'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned build and validation tools
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Validate actual tagged code and synthetic fixtures
        run: |
          python -m unittest discover -s tests -v
          python tools/check_schema.py
          python tools/scan_public.py
      - name: Build, installation smoke, repeatability and checksums
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py
          python tools/smoke_artifacts.py
          python tools/check_reproducible.py
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-ad-v0.1.0a1
          path: |
            dist/ad_opsec_auditor-0.1.0a1-py3-none-any.whl
            dist/ad_opsec_auditor-0.1.0a1.tar.gz
            dist/ad-opsec-auditor-0.1.0a1.pyz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Attach verified assets and publish existing draft
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-ad-v0.1.0a1
          path: release-dist
      - name: Verify existing release, upload, verify downloads, publish, verify again
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py --dist release-dist
