name: Проверки автономного аудитора
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Автономные проверки (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Установка инструментов с проверкой хешей
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Модульные и CLI тесты на синтетических данных
        run: python -m unittest discover -s tests -v
      - name: Сверка с эталонной схемой
        run: python tools/check_schema.py
      - name: Проверка публичных файлов
        run: python tools/scan_public.py
      - name: Сборка артефактов предварительного выпуска
        run: python tools/build_release.py
      - name: Проверка установленных wheel, zipapp и исходного архива
        run: python tools/smoke_artifacts.py
      - name: Сравнение повторных сборок
        run: python tools/check_reproducible.py
