name: Offline auditor CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned build and reference-validation tools
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Unit and CLI integration tests (synthetic data only)
        run: python -m unittest discover -s tests -v
      - name: Reference schema agreement
        run: python tools/check_schema.py
      - name: Public-file guard
        run: python tools/scan_public.py
      - name: Build prerelease artifacts
        run: python tools/build_release.py
      - name: Installed wheel, zipapp and sdist smoke tests
        run: python tools/smoke_artifacts.py
      - name: Repeated build comparison
        run: python tools/check_reproducible.py
